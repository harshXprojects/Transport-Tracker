<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        .header {
            background-color: #2d89ef;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .route {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .route h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #2d89ef;
        }
        .route p {
            margin: 5px 0;
        }
        .route button {
            padding: 10px 15px;
            font-size: 1rem;
            color: #fff;
            background-color: #2d89ef;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .route button:hover {
            background-color: #1e63c3;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const start = urlParams.get('start');
            const destination = urlParams.get('destination');

            if (start && destination) {
                document.querySelectorAll('.route').forEach(route => {
                    route.querySelector('.start').textContent = start;
                    route.querySelector('.destination').textContent = destination;
                });
            }
        });
    </script>
</head>
<body>
    <div class="header">
        <h1>Journey Results</h1>
    </div>
    <div class="container">
        <div class="route">
            <h2>Shortest Route</h2>
            <p><strong>Start:</strong> <span class="start">Location A</span></p>
            <p><strong>End:</strong> <span class="destination">Location B</span></p>
            <p><strong>Duration:</strong> 45 minutes</p>
            <p><strong>Mode:</strong> Metro + Bus</p>
            <button>Book Ticket</button>
        </div>
        <div class="route">
            <h2>Cheapest Route</h2>
            <p><strong>Start:</strong> <span class="start">Location A</span></p>
            <p><strong>End:</strong> <span class="destination">Location B</span></p>
            <p><strong>Duration:</strong> 1 hour 15 minutes</p>
            <p><strong>Mode:</strong> Bus</p>
            <button>Book Ticket</button>
        </div>
        <div class="route">
            <h2>Recommended Route</h2>
            <p><strong>Start:</strong> <span class="start">Location A</span></p>
            <p><strong>End:</strong> <span class="destination">Location B</span></p>
            <p><strong>Duration:</strong> 50 minutes</p>
            <p><strong>Mode:</strong> Metro</p>
            <button onclick="window.location.href='bookingPage.html'">Book Ticket</button>
        </div>
    </div>
</body>
</html>
